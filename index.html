    <style>
        body.booting #app-pages { visibility: hidden; }
        .boot-status {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.1rem;
            background: #fff;
            color: #047857;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 700;
            padding: 1.5rem;
            text-align: center;
            transition: opacity 0.18s ease;
        }
        body:not(.booting) .boot-status { display: none; }
        /* La lumière qui respire accompagne le chargement. */
        .boot-boite { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
        .boot-halo {
            position: absolute;
            inset: -26px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(16, 185, 129, 0) 68%);
            animation: bootHalo 2.4s ease-in-out infinite;
        }
        .boot-logo { position: relative; width: 64px; height: 64px; border-radius: 16px; animation: bootLogo 2.4s ease-in-out infinite; }
        .boot-mot { margin: 0; color: #047857; font-weight: 700; font-size: 0.98rem; }
        body.boot-fini .boot-status { opacity: 0; }
        body.boot-erreur .boot-status { display: flex; opacity: 1; }
        body.boot-erreur .boot-boite { display: none; }
        @keyframes bootHalo { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.18); opacity: 0.95; } }
        @keyframes bootLogo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @media (prefers-reduced-motion: reduce) {
            .boot-halo, .boot-logo { animation: none; }
            .boot-status { transition: none; }
        }
    </style>
</head>
