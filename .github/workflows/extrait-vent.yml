name: Extrait du son Vent

on:
  workflow_dispatch:
    inputs:
      url:
        description: Lien de telechargement direct du fichier audio
        required: true

permissions:
  contents: read

jobs:
  extrait:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Préparer ffmpeg et numpy
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          python3 -m pip install --quiet --disable-pip-version-check numpy

      - name: Télécharger l'enregistrement dans /tmp
        env:
          VENT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --retry-delay 5 --max-time 900 "$VENT_URL" -o /tmp/vents.mp3 || true
          if [ ! -s /tmp/vents.mp3 ] || [ "$(stat -c%s /tmp/vents.mp3)" -lt 100000000 ]; then
            echo "Le premier lien n'a pas donné le fichier complet, second essai."
            ID=$(printf '%s' "$VENT_URL" | sed -n 's/.*id=\([A-Za-z0-9_-]*\).*/\1/p')
            curl -sSL --retry 3 --retry-delay 5 --max-time 900 \
              "https://drive.google.com/uc?export=download&id=$ID&confirm=t" -o /tmp/vents.mp3
          fi
          echo "Taille : $(stat -c%s /tmp/vents.mp3) octets"
          test "$(stat -c%s /tmp/vents.mp3)" -gt 100000000
          head -c 4 /tmp/vents.mp3 | od -An -tx1

      - name: Extraire la boucle de 7,91 s
        run: |
          python3 tools/extrait-vent.py --mp3 /tmp/vents.mp3 \
            --sortie audio/pomodoro/vent.wav --copie /tmp/vent/vent.wav

      - uses: actions/upload-artifact@v4
        with:
          name: vent
          path: /tmp/vent/
          retention-days: 1
          if-no-files-found: error
