name: Boîte partagée

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - arena/01a0bac7-learning-dp1
    paths:
      - .github/workflows/boite.yml
      - tools/creer-boite.py
      - tools/sync-emplois.py

permissions:
  contents: write

jobs:
  creer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bac7-learning-dp1

      - name: Créer le coffre
        run: python3 tools/creer-boite.py

      - name: Rassembler les emplois du temps
        run: python3 tools/sync-emplois.py

      - name: Enregistrer l'adresse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boite-url.json data/boite-statut.txt data/emplois.json
          git diff --cached --quiet && exit 0
          git commit -m "Met à jour les emplois du temps reçus."
          git push origin HEAD:arena/01a0bac7-learning-dp1
