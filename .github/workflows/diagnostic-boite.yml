name: Diagnostic boîte

on:
  push:
    paths:
      - '.boite-trigger'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Lire le fil complet de la boîte
        run: |
          mkdir -p /tmp/boite
          python3 - <<'PY' > /tmp/boite/apercu.txt 2>&1
          import json, urllib.request
          SUJET = 'ibx-7c4e9a2b8d1f6c3e5a0b9d4f2e8c1a6b'
          url = 'https://ntfy.sh/' + SUJET + '/json?poll=1&since=all'
          with urllib.request.urlopen(url, timeout=60) as res:
              brut = res.read().decode('utf-8', 'replace')
          lignes = [l for l in brut.splitlines() if l.strip()]
          print('lignes', len(lignes))
          utiles = []
          for ligne in lignes:
              try:
                  enveloppe = json.loads(ligne)
              except Exception:
                  continue
              corps = enveloppe.get('message') or ''
              try:
                  item = json.loads(corps)
              except Exception:
                  continue
              if not isinstance(item, dict):
                  continue
              if item.get('type') in ('question', 'reponse', 'feedback', 'coffre'):
                  utiles.append(item)
          print('utiles', len(utiles))
          def court(it):
              return json.dumps({
                  'type': it.get('type'), 'id': it.get('id'), 'at': it.get('at'),
                  'nom': it.get('nom'), 'googleNom': it.get('googleNom'),
                  'email': it.get('email'), 'google': it.get('google'),
                  'destinataire': it.get('destinataire'), 'questionId': it.get('questionId'),
                  'personne': it.get('personne'), 'mail': it.get('mail'),
                  'repondu': it.get('repondu'), 'gmailId': (str(it.get('gmailId') or ''))[:20],
                  'kvdb': it.get('kvdb'), 'archive': it.get('archive'),
                  'texte': str(it.get('texte') or '')[:100]
              }, ensure_ascii=False)
          for it in utiles:
              print(court(it))
          PY
          cat /tmp/boite/apercu.txt | head -5
      - name: Publier
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/boite/apercu.txt ]; then
            echo "echec" > /tmp/boite/apercu.txt
          fi
          cd /tmp/boite
          git init -q .
          git checkout -q -b tmp/boite
          git add -A
          git -c user.name="Arena" -c user.email="arena@users.noreply.github.com" \
              commit -q -m "Aperçu de la boîte"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/tmp/boite
