name: Ensembles Drive

on:
  push:
    paths:
      - '.sons3-trigger'

permissions:
  contents: write

jobs:
  ensembles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          mkdir -p /tmp/sons /tmp/sortie
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          python3 -m pip install --quiet --disable-pip-version-check numpy

      - name: Télécharger les sons du Drive
        continue-on-error: true
        run: |
          set -uo pipefail
          telecharger() {
            id="$1"; dest="$2"
            curl -sSL --retry 3 --retry-delay 5 --max-time 900 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" -o "$dest" || true
            if [ ! -s "$dest" ] || [ "$(stat -c%s "$dest")" -lt 100000 ]; then
              curl -sSL --retry 3 --retry-delay 5 --max-time 900 \
                "https://drive.google.com/uc?export=download&id=${id}&confirm=t" -o "$dest"
            fi
            echo "$dest : $(stat -c%s "$dest") octets"
            test "$(stat -c%s "$dest")" -gt 100000
          }
          telecharger "18u8wZSqhjQcfk9Rm3jaygT0FpqAp6GZu" /tmp/sons/tonnerre-1.mp3
          telecharger "10lD2x0vDYuo5qw5HIS4doTjhP1x5g77x" /tmp/sons/tonnerre-4.mp3
          telecharger "17deoGQl17lnCsaqrveUCPXRN4tMbHir7" /tmp/sons/tonnerre-6.mp3

      - name: Assembler les boucles
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 tools/construire-ensemble.py --cible orage --sortie /tmp/sortie \
              --source tonnerre-1=/tmp/sons/tonnerre-1.mp3 \
              --source tonnerre-4=/tmp/sons/tonnerre-4.mp3 \
              --source tonnerre-6=/tmp/sons/tonnerre-6.mp3
          } 2>&1 | tee /tmp/sortie/journal.txt
          test -s /tmp/sortie/orage.mp3

      - name: Publier le résultat
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/sortie/orage.mp3 ]; then
            echo "La fabrication n'a pas abouti." > /tmp/sortie/ECHEC.txt
            tail -40 /tmp/sortie/journal.txt >> /tmp/sortie/ECHEC.txt 2>&1 || true
          fi
          cd /tmp/sortie
          git init -q .
          git checkout -q -b tmp/sons3
          git add -A
          git -c user.name="Arena" -c user.email="arena@users.noreply.github.com" \
              commit -q -m "Ensemble orage"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/tmp/sons3
