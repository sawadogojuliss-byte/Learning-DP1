name: Sons longs du Pomodoro

on:
  push:
    paths:
      - '.sons-trigger'

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          mkdir -p /tmp/sons /tmp/sortie
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          python3 -m pip install --quiet --disable-pip-version-check numpy

      - name: Télécharger les 8 musiques
        continue-on-error: true
        run: |
          set -uo pipefail
          telecharger() {
            slug="$1"; id="$2"
            url="https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            curl -sSL --retry 3 --retry-delay 5 --max-time 1800 "$url" -o "/tmp/sons/$slug.mp3" || true
            taille=$(stat -c%s "/tmp/sons/$slug.mp3" 2>/dev/null || echo 0)
            if [ "$taille" -lt 40000000 ]; then
              echo "  second essai pour $slug"
              curl -sSL --retry 3 --retry-delay 5 --max-time 1800 \
                "https://drive.google.com/uc?export=download&id=$id&confirm=t" -o "/tmp/sons/$slug.mp3" || true
              taille=$(stat -c%s "/tmp/sons/$slug.mp3" 2>/dev/null || echo 0)
            fi
            echo "$slug : $taille octets"
            du -h "/tmp/sons/$slug.mp3" 2>/dev/null || true
          }
          telecharger cafe 1Cg6XFay-CcfUOHAXQK3tyxvKcugH6e1J
          telecharger brainfm 1q14dEPgEdA1x-teOwBa73RStYkmdP8U2
          telecharger flowstate 1l3J3ZmvAwEX3ZAYGiq87B081NmChAWeu
          telecharger pluie 1IGQKKPWHZTUeQeyG-nGWIcfZZVLXp7nz
          telecharger classique 1XxEQIaM8hHKAJzHdKTSny8sM2G3hg4Ka
          telecharger gamma 1LreNS-xmOCCHlrSb2h9BwT5-fjqzbxNr
          telecharger vents 1FnsF8FMn_G-txnaqUmQrg2RKZzuQiNkb
          telecharger 8d 1OlQ0fdXw20p2omMD4np30CiAqNnlL441
          ls -l /tmp/sons
          test -s /tmp/sons/cafe.mp3 && test -s /tmp/sons/pluie.mp3

      - name: Fabriquer les 18 boucles de 5 minutes
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/construire-sons-longs.py --sources /tmp/sons --sortie /tmp/sortie 2>&1 \
            | tee /tmp/sortie/journal.txt
          ls -l /tmp/sortie

      - name: Publier le résultat dans une branche temporaire
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/sortie/manifeste.json ]; then
            echo "La fabrication n'a pas abouti." > /tmp/sortie/ECHEC.txt
            tail -60 /tmp/sortie/journal.txt >> /tmp/sortie/ECHEC.txt 2>&1 || true
          fi
          cd /tmp/sortie
          git init -q .
          git checkout -q -b tmp/sons
          git add -A
          git -c user.name="Arena" -c user.email="arena@users.noreply.github.com" \
              commit -q -m "Sons longs du Pomodoro"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/tmp/sons
