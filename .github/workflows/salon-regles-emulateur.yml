name: Règles du salon — émulateur Firestore
on:
  push:
    paths:
      - firestore.rules
      - js/pages/salon-focus-firebase.js
      - js/pages/salon-focus-coeur.js
      - tools/tester-salon-regles.cjs
      - tools/tester-salon-firebase-emulateur.cjs
      - .github/workflows/salon-regles-emulateur.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-regles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer les outils de test hors du dépôt
        run: |
          mkdir -p "$RUNNER_TEMP/salon-test"
          npm install --prefix "$RUNNER_TEMP/salon-test" --no-audit --no-fund firebase@10.14.1 @firebase/rules-unit-testing@3.0.4 firebase-tools@13.35.1
      - name: Tester les règles sans accès à la production
        env:
          STUDY_TEST_MODULES: ${{ runner.temp }}/salon-test/node_modules
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
        run: |
          cp firestore.rules "$RUNNER_TEMP/salon-test/firestore.rules"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > "$RUNNER_TEMP/salon-test/firebase.json"
          set +e
          "$RUNNER_TEMP/salon-test/node_modules/.bin/firebase" emulators:exec --project demo-studyplan-salon-rules --config "$RUNNER_TEMP/salon-test/firebase.json" --only firestore 'node tools/tester-salon-regles.cjs && node tools/tester-salon-firebase-emulateur.cjs' > "$RUNNER_TEMP/salon-test/resultat.log" 2>&1
          resultat=$?
          cat "$RUNNER_TEMP/salon-test/resultat.log"
          if [ "$resultat" -ne 0 ]; then
            message=$(tail -c 6000 "$RUNNER_TEMP/salon-test/resultat.log" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error::$message"
          fi
          exit "$resultat"
