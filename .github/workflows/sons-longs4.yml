name: Boucle train

on:
  push:
    paths:
      - '.sons4-trigger'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          mkdir -p /tmp/sons /tmp/sortie
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          python3 -m pip install --quiet --disable-pip-version-check numpy

      - name: Télécharger la locomotive du Drive
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sSL --retry 3 --retry-delay 5 --max-time 900 \
            "https://drive.usercontent.google.com/download?id=1yTievPx-Gs33fCKKWcJ6CB72B91LbDho&export=download&confirm=t" -o /tmp/sons/locomotive.mp3 || true
          if [ ! -s /tmp/sons/locomotive.mp3 ] || [ "$(stat -c%s /tmp/sons/locomotive.mp3)" -lt 1000000 ]; then
            curl -sSL --retry 3 --retry-delay 5 --max-time 900 \
              "https://drive.google.com/uc?export=download&id=1yTievPx-Gs33fCKKWcJ6CB72B91LbDho&confirm=t" -o /tmp/sons/locomotive.mp3
          fi
          echo "/tmp/sons/locomotive.mp3 : $(stat -c%s /tmp/sons/locomotive.mp3) octets"
          test "$(stat -c%s /tmp/sons/locomotive.mp3)" -gt 1000000

      - name: Fabriquer la boucle du train
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 tools/construire-boucle-courte.py --source /tmp/sons/locomotive.mp3 \
              --id train --nom-source locomotive-vapeur --sortie /tmp/sortie
          } 2>&1 | tee /tmp/sortie/journal.txt
          test -s /tmp/sortie/train.mp3

      - name: Publier le résultat
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/sortie/train.mp3 ]; then
            echo "La fabrication n'a pas abouti." > /tmp/sortie/ECHEC.txt
            tail -40 /tmp/sortie/journal.txt >> /tmp/sortie/ECHEC.txt 2>&1 || true
          fi
          cd /tmp/sortie
          git init -q .
          git checkout -q -b tmp/sons4
          git add -A
          git -c user.name="Arena" -c user.email="arena@users.noreply.github.com" \
              commit -q -m "Boucle du train"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/tmp/sons4
