name: Publication contrôlée de Studyplan

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f4de29cb-learning-dp1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication-pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le travail de la branche courante
        uses: actions/checkout@v4
        with:
          path: travail
      - name: Récupérer la base exacte du site publié
        uses: actions/checkout@v4
        with:
          ref: 1efb82e236505af518b4e6fa3065b170ab1e2ae2
          path: base-publique
      - name: Vérifier la configuration et la branche publique
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actif=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/arena/b9e08b94-learning-dp1 | cut -f1)
          test "$actif" = "1efb82e236505af518b4e6fa3065b170ab1e2ae2" || { echo "La branche publique a changé : arrêt avant publication."; exit 1; }
          type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          test "$type" = workflow || { echo "Configurer d'abord GitHub Pages sur GitHub Actions."; exit 1; }
      - name: Assembler seulement le chalet animé
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base-publique/.git
          python3 travail/tools/preparer-publication-pages.py base-publique site "p-${GITHUB_SHA:0:12}"
          node --check site/js/pages/pomodoro-page.js
          node --check site/service-worker.js
          node site/tools/verifier-pomodoro.js
      - name: Préparer le paquet Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier le site testé
        id: deploiement
        uses: actions/deploy-pages@v4

  verifier-en-ligne:
    needs: publier
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les tests
        uses: actions/checkout@v4
      - name: Préparer le navigateur de test
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/study-pomodoro-test playwright
          /tmp/study-pomodoro-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Tester le thème sur le site public avec un profil vierge
        env:
          STUDY_SITE: https://sawadogojuliss-byte.github.io/Learning-DP1/
          STUDY_TEST_MODULES: /tmp/study-pomodoro-test/node_modules
          STUDY_PLAYWRIGHT_SYSTEM: '1'
        run: node tools/tester-pomodoro-anime.mjs
