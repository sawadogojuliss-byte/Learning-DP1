name: Publier le lien public

on:
  push:
    branches:
      - 'arena/01a0bac7-learning-dp1'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construire et publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: python3 tools/publish-public.py
