name: Publier le site

on:
  push:
    branches:
      - 'arena/01a0bac7-learning-dp1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
  checks: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activer GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method POST "repos/${{ github.repository }}/pages" -f build_type=workflow
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            gh api "repos/${{ github.repository }}/pages"
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Noter le lien public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then url="https://sawadogojuliss-byte.github.io/Learning-DP1/"; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="site public" \
            -f description="Lien a envoyer aux amis" \
            -f target_url="$url"

  lien-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier un lien sans Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          base="https://cdn.jsdelivr.net/gh/sawadogojuliss-byte/Learning-DP1@${sha}"
          report=""
          ok=1
          for path in index.html js/boot.js js/registre.js style_v1.css pages/planning.html css/compte.css; do
            line=$(curl -sI -L --max-time 40 "$base/$path" | tr -d '\r' | awk 'BEGIN{c="";t=""} /^HTTP/{c=$2} tolower($1)=="content-type:"{t=$2} END{print c" "t}')
            report="${report}- ${path}: ${line}"$'\n'
            echo "$path $line"
            case "$line" in
              200*) ;;
              *) ok=0 ;;
            esac
          done
          pages=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://sawadogojuliss-byte.github.io/Learning-DP1/" || echo 000)
          branch=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://cdn.jsdelivr.net/gh/sawadogojuliss-byte/Learning-DP1@arena/01a0bac7-learning-dp1/index.html" || echo 000)
          report="${report}- github.io: ${pages}"$'\n'"- branche jsDelivr: ${branch}"$'\n'
          url="$base/index.html"
          export REPORT="$report" SHA="$sha" OK="$ok" URL="$url"
          python3 - << PY
          import json, os
          summary = os.environ["REPORT"]
          payload = {
            "name": "lien public",
            "head_sha": os.environ["SHA"],
            "status": "completed",
            "conclusion": "success" if os.environ["OK"] == "1" else "failure",
            "details_url": os.environ["URL"],
            "output": {"title": "Lien a envoyer", "summary": os.environ["URL"] + "\n\n" + summary}
          }
          open("/tmp/check.json","w").write(json.dumps(payload))
          PY
          gh api --method POST "repos/${{ github.repository }}/check-runs" --input /tmp/check.json || true
          gh api --method POST "repos/${{ github.repository }}/statuses/${sha}" \
            -f state="$([ "$ok" = 1 ] && echo success || echo failure)" \
            -f context="lien cdn" \
            -f description="fichiers jsDelivr" \
            -f target_url="$url"
