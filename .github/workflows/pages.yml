name: Verifier le lien public

on:
  push:
    branches:
      - 'arena/01a0bac7-learning-dp1'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  lien:
    runs-on: ubuntu-latest
    steps:
      - name: Trouver un lien qui affiche le site
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          python3 - << PY
          import json, os, subprocess
          sha = os.environ["SHA"]
          candidates = [
            f"https://cdn.statically.io/gh/sawadogojuliss-byte/Learning-DP1/{sha}/index.html",
            f"https://media.githubusercontent.com/media/sawadogojuliss-byte/Learning-DP1/{sha}/index.html",
            f"https://rawcdn.githack.com/sawadogojuliss-byte/Learning-DP1/{sha}/index.html",
            f"https://raw.githack.com/sawadogojuliss-byte/Learning-DP1/{sha}/index.html",
            f"https://cdn.jsdelivr.net/gh/sawadogojuliss-byte/Learning-DP1@{sha}/index.html",
          ]
          lines = []
          chosen = ""
          for url in candidates:
              proc = subprocess.run(
                  ["curl", "-sL", "--max-time", "40", "-o", "/tmp/body.html", "-w", "%{http_code} %{content_type}", url],
                  capture_output=True, text=True)
              meta = (proc.stdout or "").strip()
              body = open("/tmp/body.html", encoding="utf-8", errors="replace").read(180)
              html = "Study Plan IB" in body
              lines.append(f"- {meta} html={html} {url}")
              code, _, ctype = (meta + "  ").partition(" ")
              if not chosen and code == "200" and "text/html" in ctype and html:
                  chosen = url
          summary = (chosen or "aucun") + "\n\n" + "\n".join(lines)
          open("/tmp/check.json","w").write(json.dumps({
            "name": "lien public",
            "head_sha": sha,
            "status": "completed",
            "conclusion": "success" if chosen else "failure",
            "details_url": chosen or candidates[0],
            "output": {"title": "Lien a envoyer", "summary": summary[:60000]}
          }))
          open("/tmp/chosen.txt","w").write(chosen)
          print(summary)
          PY
          chosen=$(cat /tmp/chosen.txt)
          if [ -n "$chosen" ]; then
            gh api --method POST "repos/${{ github.repository }}/statuses/${sha}" \
              -f state=success -f context="lien public" \
              -f description="Lien a envoyer aux amis" -f target_url="$chosen"
          fi
          gh api --method POST "repos/${{ github.repository }}/check-runs" --input /tmp/check.json
