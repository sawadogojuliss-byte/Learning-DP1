name: Lien public

on:
  push:
    branches:
      - 'arena/01a0bac7-learning-dp1'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  partager:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Ouvrir un lien public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 tools/share-public.py
