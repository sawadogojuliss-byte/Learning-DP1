name: Passage piano

on:
  push:
    paths:
      - '.piano-trigger'

permissions:
  contents: write

jobs:
  piano:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          mkdir -p /tmp/sons /tmp/piano
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          python3 -m pip install --quiet --disable-pip-version-check numpy

      - name: Télécharger « Musique classique »
        continue-on-error: true
        run: |
          set -uo pipefail
          url="https://drive.usercontent.google.com/download?id=1hNUjpURjUon6nnGJbiiL_VbcKSfxbdWP&export=download&confirm=t"
          curl -sSL --retry 3 --retry-delay 5 --max-time 1800 "$url" -o /tmp/sons/classique.mp3 || true
          if [ ! -s /tmp/sons/classique.mp3 ] || [ "$(stat -c%s /tmp/sons/classique.mp3)" -lt 40000000 ]; then
            curl -sSL --retry 3 --retry-delay 5 --max-time 1800 \
              "https://drive.google.com/uc?export=download&id=1hNUjpURjUon6nnGJbiiL_VbcKSfxbdWP&confirm=t" \
              -o /tmp/sons/classique.mp3
          fi
          echo "Taille : $(stat -c%s /tmp/sons/classique.mp3) octets"
          test "$(stat -c%s /tmp/sons/classique.mp3)" -gt 40000000
          # Un vrai MP3 commence par ID3 ou par une trame 0xFF Ex
          head -c 3 /tmp/sons/classique.mp3 > /tmp/entete.bin
          if [ "$(cat /tmp/entete.bin)" = "ID3" ] || [ "$(od -An -tx1 -N1 /tmp/sons/classique.mp3 | tr -d ' ')" = "ff" ]; then
            echo "Fichier audio reconnu." | tee -a /tmp/piano/journal.txt
          else
            echo "Ce n'est pas un MP3 : téléchargement refusé." | tee -a /tmp/piano/journal.txt
            exit 1
          fi

      - name: Choisir le passage piano
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/choisir-piano.py --source /tmp/sons/classique.mp3 \
            --sortie /tmp/piano --eviter 6060 2>&1 | tee /tmp/piano/journal.txt
          test -s /tmp/piano/piano.mp3

      - name: Publier le résultat
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/piano/piano.mp3 ]; then
            echo "La sélection n'a pas abouti." > /tmp/piano/ECHEC.txt
            tail -40 /tmp/piano/journal.txt >> /tmp/piano/ECHEC.txt 2>&1 || true
          fi
          cd /tmp/piano
          git init -q .
          git checkout -q -b tmp/piano
          git add -A
          git -c user.name="Arena" -c user.email="arena@users.noreply.github.com" \
              commit -q -m "Passage piano"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/tmp/piano
