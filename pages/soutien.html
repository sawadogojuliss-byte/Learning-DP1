<!-- ============================================================
     PAGE : Soutien
     Humeur et encouragements.
     Script : js/pages/soutien.js
     ============================================================ -->
<div class="app-panel" id="panelSoutien">
        <div style="max-width:480px;margin:0 auto;padding:0 1rem 4rem;">
            <!-- Header -->
            <div style="position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);padding:0.875rem 0;margin-bottom:1.5rem;border-bottom:1px solid #f3f4f6;">
                <div style="display:flex;align-items:center;gap:0.75rem;">
                    <button onclick="navigateTo('planning')" style="width:2.25rem;height:2.25rem;background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:0.625rem;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#059669;">←</button>
                    <div><h2 style="font-size:1.1rem;font-weight:800;color:#111827;">Soutien & Humeur</h2><p style="font-size:0.75rem;color:#6b7280;">Comment tu te sens aujourd'hui ?</p></div>
                </div>
            </div>

            <!-- Date + nom -->
            <div style="background:linear-gradient(135deg,#059669,#10b981,#34d399);border-radius:1.25rem;padding:1.5rem;margin-bottom:1.5rem;color:white;position:relative;overflow:hidden;">
                <div style="position:absolute;top:-20px;right:-20px;width:100px;height:100px;background:rgba(255,255,255,0.1);border-radius:50%;"></div>
                <div style="position:absolute;bottom:-30px;left:50%;width:80px;height:80px;background:rgba(255,255,255,0.08);border-radius:50%;"></div>
                <p style="font-size:0.85rem;opacity:0.85;margin-bottom:0.25rem;" id="soutienDate"></p>
                <h3 style="font-size:1.4rem;font-weight:800;margin-bottom:0.25rem;" id="soutienGreet"></h3>
                <p style="font-size:0.9rem;opacity:0.9;">Prends soin de toi autant que de tes révisions 💚</p>
            </div>

            <!-- Choix humeur -->
            <div style="margin-bottom:1.5rem;">
                <h3 style="font-size:1rem;font-weight:700;color:#111827;margin-bottom:1rem;text-align:center;">Comment tu te sens en ce moment ?</h3>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.625rem;" id="moodGrid">
                    <button class="mood-btn" onclick="selectMood('motive')" data-mood="motive">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">🔥</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#059669;">Super motivé</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('bien')" data-mood="bien">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😊</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#374151;">Je vais bien</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('fatigue')" data-mood="fatigue">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😴</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#d97706;">Fatigué(e)</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('stresse')" data-mood="stresse">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😰</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#dc2626;">Stressé(e)</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('mauvaisnote')" data-mood="mauvaisnote">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">📉</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#dc2626;">Mauvaise note</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('perdu')" data-mood="perdu">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😕</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#6b7280;">Perdu(e)</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('anxieux')" data-mood="anxieux">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😟</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#7c3aed;">Anxieux(se)</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('decourage')" data-mood="decourage">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😞</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#6b7280;">Découragé(e)</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('depasse')" data-mood="depasse">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">🤯</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#dc2626;">Dépassé(e)</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('fier')" data-mood="fier">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">🏆</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#059669;">Fier/Fière</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('ennuye')" data-mood="ennuye">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😑</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#6b7280;">Ennuyé(e)</div>
                    </button>
                    <button class="mood-btn" onclick="selectMood('neutre')" data-mood="neutre">
                        <div style="font-size:1.75rem;margin-bottom:0.25rem;">😐</div>
                        <div style="font-size:0.7rem;font-weight:700;color:#374151;">Neutre</div>
                    </button>
                </div>
            </div>

            <!-- Message d'encouragement -->
            <div id="encouragementSection" style="display:none;">
                <div id="encouragementCard" class="encour-card"></div>

                <!-- Tips personnalisés -->
                <div id="moodTips" style="background:white;border:1.5px solid #e5e7eb;border-radius:1rem;padding:1.25rem;margin-bottom:1rem;">
                    <h4 style="font-weight:700;color:#111827;margin-bottom:0.75rem;font-size:0.9rem;">💡 Conseils pour toi</h4>
                    <div id="moodTipsList" style="display:flex;flex-direction:column;gap:0.625rem;"></div>
                </div>

                <!-- Quote du jour -->
                <div id="quoteCard" style="background:linear-gradient(135deg,#ecfdf5,#f0fdf4);border:1.5px solid #a7f3d0;border-radius:1rem;padding:1.25rem;margin-bottom:1rem;text-align:center;">
                    <p style="font-size:1.05rem;font-weight:600;color:#064e3b;line-height:1.6;font-style:italic;" id="quoteText"></p>
                    <p style="font-size:0.75rem;color:#6b7280;margin-top:0.5rem;" id="quoteAuthor"></p>
                </div>

                <!-- Action boutons -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;">
                    <button onclick="selectMood(null);document.getElementById('encouragementSection').style.display='none';" style="padding:0.875rem;background:#f3f4f6;color:#374151;font-weight:600;border:none;border-radius:0.875rem;cursor:pointer;font-size:0.85rem;">🔄 Changer d'humeur</button>
                    <button onclick="navigateTo('planning')" style="padding:0.875rem;background:linear-gradient(to right,#10b981,#059669);color:white;font-weight:700;border:none;border-radius:0.875rem;cursor:pointer;font-size:0.85rem;">📅 Mon planning</button>
                </div>

                <!-- Streak -->
                <div style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1.5px solid #fcd34d;border-radius:1rem;padding:1.25rem;text-align:center;">
                    <div style="font-size:1.75rem;margin-bottom:0.25rem;">🔥</div>
                    <p style="font-weight:800;color:#92400e;font-size:1.1rem;" id="streakCount">1 jour</p>
                    <p style="font-size:0.8rem;color:#b45309;">jours de connexion</p>
                </div>
            </div>
        </div>
    </div>
