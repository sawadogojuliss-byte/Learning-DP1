<!-- ============================================================
     PAGE : Tutoriel
     Les administrateurs publient des vidéos. Les élèves les regardent.
     Script : js/pages/tutoriel.js
     ============================================================ -->
<div class="app-panel" id="panelTutoriel">
    <div style="max-width:480px;margin:0 auto;padding:0 1rem 4rem;">
        <div style="position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);padding:0.875rem 0;margin-bottom:1.25rem;border-bottom:1px solid #f3f4f6;">
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <button type="button" onclick="navigateTo('planning')" style="width:2.25rem;height:2.25rem;background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:0.625rem;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#059669;">←</button>
                <div>
                    <h2 style="font-size:1.1rem;font-weight:800;color:#111827;">Tutoriel</h2>
                    <p style="font-size:0.75rem;color:#6b7280;">Vidéos pour utiliser le site</p>
                </div>
            </div>
        </div>

        <div id="tutorielCompose" style="display:none;background:white;border:1.5px solid #e5e7eb;border-radius:1.15rem;padding:1rem;margin-bottom:1.25rem;">
            <p style="font-weight:800;color:#111827;margin-bottom:0.35rem;">Ajouter une vidéo</p>
            <p style="font-size:0.8rem;color:#6b7280;line-height:1.4;margin-bottom:0.85rem;">Le titre d'abord. La vidéo ensuite. Elle n'apparaît pour les élèves qu'après Publier.</p>
            <label for="tutorielTitre" style="display:block;font-size:0.8rem;font-weight:700;color:#374151;margin-bottom:0.4rem;">Titre de la vidéo</label>
            <input id="tutorielTitre" type="text" maxlength="80" autocomplete="off" placeholder="Écris le titre" style="width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:0.9rem;padding:0.8rem 1rem;font:inherit;font-size:0.95rem;outline:none;">
            <div id="tutorielInsertion" style="margin-top:0.9rem;opacity:0.45;">
                <button type="button" id="tutorielChoisir" disabled style="width:100%;padding:0.85rem 1rem;border:1.5px solid #a7f3d0;border-radius:0.9rem;background:#f0fdf4;color:#047857;font-weight:800;cursor:pointer;">Insérer la vidéo</button>
                <input id="tutorielFichier" type="file" accept="video/mp4,video/webm,video/quicktime,video/*" style="display:none;">
                <p style="font-size:0.75rem;color:#6b7280;text-align:center;margin:0.65rem 0;">ou colle un lien</p>
                <input id="tutorielLien" type="url" inputmode="url" disabled maxlength="400" placeholder="YouTube, Drive ou fichier mp4" style="width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:0.9rem;padding:0.8rem 1rem;font:inherit;font-size:0.95rem;outline:none;">
                <p id="tutorielFichierNom" style="font-size:0.78rem;color:#047857;margin:0.55rem 0 0;min-height:1.1rem;"></p>
                <div id="tutorielApercu" style="margin-top:0.75rem;"></div>
            </div>
            <button type="button" id="tutorielPublier" disabled style="width:100%;margin-top:0.9rem;padding:0.9rem 1rem;border:none;border-radius:0.9rem;background:#d1d5db;color:white;font-weight:800;font-size:0.95rem;cursor:pointer;">Publier</button>
            <p id="tutorielStatut" style="min-height:1.25rem;margin-top:0.7rem;font-size:0.85rem;font-weight:650;color:#047857;"></p>
        </div>

        <div id="tutorielListe"></div>
        <p id="tutorielVide" style="color:#6b7280;font-size:0.9rem;"></p>
    </div>
</div>
