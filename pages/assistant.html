<!-- ============================================================
     PAGE : Assistant — réservé aux 4 comptes admin
     Script : js/pages/assistant.js
     ============================================================ -->
<div class="app-panel" id="panelAssistant">
    <div class="ia-shell">
        <header class="ia-top">
            <button type="button" class="ia-back" onclick="navigateTo('planning')" aria-label="Retour au planning">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <img class="ia-logo" src="images/logo.png" alt="">
            <div class="ia-titles">
                <p class="ia-kicker">Study Plan IB</p>
                <h2>Assistant</h2>
                <p id="iaSalut">Bonjour</p>
            </div>
            <div class="ia-top-actions">
                <p id="iaStatut"><span class="ia-dot"></span><span id="iaStatutTexte">En ligne</span></p>
                <button type="button" class="ia-brief" onclick="iaBriefing()">Briefing</button>
            </div>
        </header>
        <div id="iaFil" class="ia-fil"></div>
        <form id="iaForm" class="ia-composer" onsubmit="return iaEnvoyer(event)">
            <div class="ia-saisie-ligne">
                <input id="iaFichier" type="file" accept="application/pdf,.pdf" hidden>
                <button type="button" id="iaJoindre" class="ia-pdf" onclick="iaChoisirPdf()" title="Ajouter un PDF">PDF</button>
                <textarea id="iaSaisie" rows="1" maxlength="4000" placeholder="Une question, une page à ouvrir, ou un créneau à ajouter…"></textarea>
                <button type="submit" id="iaEnvoi" class="ia-send" aria-label="Envoyer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </form>
    </div>
</div>
