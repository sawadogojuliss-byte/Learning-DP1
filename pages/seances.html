<!-- ============================================================
     PAGE : Séance de révision du jour
     La page avant le minuteur : les séances de révision et d'exercices
     prévues aujourd'hui dans l'emploi du temps. Ouverte à tous.
     Script : js/pages/pomodoro-page.js
     ============================================================ -->
<div class="app-panel" id="panelSeances">
    <div class="focus-accueil" id="focusAccueil">
        <div class="focus-accueil-fond" id="focusAccueilFond"></div>
        <div class="focus-accueil-voile"></div>
        <div class="focus-accueil-boite">
            <div class="focus-accueil-haut">
                <div class="focus-accueil-gauche">
                    <p class="focus-accueil-logo">Studyplan</p>
                    <p class="focus-accueil-bonjour" id="focusAccueilBonjour"></p>
                </div>
            </div>
            <h2 class="focus-accueil-titre">Séance de révision du jour</h2>
            <p class="focus-accueil-sous" id="focusAccueilSous">Les révisions et les exercices prévus aujourd'hui. Lance uniquement la séance en cours.</p>
            <div class="focus-accueil-stats" id="focusAccueilStats"></div>
            <div class="focus-accueil-liste" id="focusAccueilListe"></div>
            <p class="focus-accueil-note" id="focusAccueilNote" role="status" aria-live="polite"></p>
            <div class="focus-accueil-bas">
                <button type="button" class="focus-accueil-continuer" id="focusAccueilContinuer" onclick="focusEntrerPiece()">Lancer le minuteur</button>
            </div>
        </div>
        <!-- La galerie des décors, comme dans le minuteur : la photo se
             choisit ici aussi, et reste la même dans le Pomodoro. -->
        <div id="accueilFonds" class="focus-fonds" hidden></div>
    </div>
</div>

<dialog id="focusChoixSeance" class="focus-choix-seance" aria-labelledby="focusChoixTitre" aria-describedby="focusChoixDetail" onclose="focusChoixSeanceEnCours = null">
    <div class="focus-choix-contenu">
        <span class="focus-choix-sur-titre">TON TEMPS DE RÉVISION</span>
        <h2 id="focusChoixTitre">Prêt à te concentrer ?</h2>
        <p id="focusChoixDetail" role="status"></p>
        <label id="focusChoixLigne" for="focusChoixNombre">Combien de séances souhaites-tu faire ?
            <input id="focusChoixNombre" type="number" min="1" max="12" step="1" inputmode="numeric">
        </label>
        <p class="focus-choix-note">Ton objectif déjà saisi est conservé. Tu peux le modifier dans le minuteur.</p>
        <div class="focus-choix-actions"><button type="button" onclick="focusFermerChoixSeance()">Retour</button><button id="focusChoixLancer" type="button" onclick="focusConfirmerChoixSeance()">Lancer le minuteur</button></div>
    </div>
</dialog>
