<!-- ============================================================
     PAGE : Séance de révision du jour
     La page avant le minuteur : les séances de révision et d'exercices
     prévues aujourd'hui dans l'emploi du temps. Ouverte à tous.
     Script : js/pages/pomodoro-page.js
     ============================================================ -->
<div class="app-panel" id="panelSeances">
    <div class="focus-accueil" id="focusAccueil">
        <div class="focus-accueil-fond" id="focusAccueilFond"></div>
        <div class="focus-accueil-voile"></div>
        <div class="focus-accueil-boite">
            <div class="focus-accueil-haut">
                <p class="focus-accueil-logo">Study Plan IB</p>
                <p class="focus-accueil-bonjour" id="focusAccueilBonjour"></p>
            </div>
            <h2 class="focus-accueil-titre">Séance de révision du jour</h2>
            <p class="focus-accueil-sous" id="focusAccueilSous">Les révisions et les exercices prévus aujourd'hui. Choisis une séance, puis lance le minuteur Pomodoro.</p>
            <div class="focus-accueil-stats" id="focusAccueilStats"></div>
            <div class="focus-accueil-liste" id="focusAccueilListe"></div>
            <p class="focus-accueil-note" id="focusAccueilNote"></p>
            <div class="focus-accueil-bas">
                <button type="button" class="focus-accueil-libre" onclick="focusEntrerPiece(true)">Minuteur libre</button>
                <button type="button" class="focus-accueil-continuer" id="focusAccueilContinuer" onclick="focusEntrerPiece()">Lancer le minuteur</button>
            </div>
        </div>
        <!-- La musique, comme dans le minuteur : les sons d'ambiance et les
             playlists YouTube de l'élève. -->
        <div class="focus-accueil-musique">
            <button type="button" id="accueilBtnSons" class="focus-rond" onclick="focusBasculerSonsAccueil()" aria-label="Sons d'ambiance">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h3.5L12 18V6l-4.5 4H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 7.5a6.5 6.5 0 0 1 0 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button type="button" id="accueilBtnPlaylist" class="focus-rond" onclick="focusBasculerPlaylist()" aria-label="Playlist YouTube">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h7M4 10h7M4 14h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12.5 16V8.6L19 7.2v7.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10.6" cy="16" r="2" stroke="currentColor" stroke-width="2"/><circle cx="17.1" cy="14.5" r="2" stroke="currentColor" stroke-width="2"/></svg>
            </button>
        </div>
    </div>
</div>
