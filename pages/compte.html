<!-- ============================================================
     PAGE : Compte
     Mémoire de l'appareil et connexion Google.
     Script : js/compte.js
     ============================================================ -->
<div id="compteModal" class="compte-overlay" onclick="if (event.target === this) fermerCompte()">
    <div class="compte-card" role="dialog" aria-labelledby="compteTitre">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;">
            <div>
                <p style="font-size:0.75rem;font-weight:700;color:#059669;letter-spacing:0.04em;text-transform:uppercase;margin:0;">Study Plan IB</p>
                <h2 id="compteTitre">Mon compte</h2>
            </div>
            <button type="button" onclick="fermerCompte()" style="width:2rem;height:2rem;border:none;border-radius:50%;background:#f3f4f6;cursor:pointer;font-size:1rem;">✕</button>
        </div>
        <div id="compteProfil" class="compte-profil" hidden>
            <img id="compteAvatar" alt="" hidden>
            <div>
                <p id="compteNom" style="font-weight:800;margin:0;"></p>
                <p id="compteEmail" style="font-size:0.8rem;color:#6b7280;margin:0.15rem 0 0;"></p>
            </div>
        </div>

        <div id="compteInvite" style="margin-top:1rem;">
            <div id="googleBtnSlot" style="display:flex;justify-content:center;min-height:2.6rem;margin-bottom:0.75rem;"></div>
            <p style="font-size:0.8rem;color:#6b7280;text-align:center;margin:0 0 0.75rem;">La connexion Google associe ce profil à ton compte sur ce navigateur.</p>
        </div>

        <div class="compte-actions">
            <button type="button" class="primary" onclick="fermerCompte()">Continuer</button>
            <button type="button" id="compteDeconnectBtn" onclick="compteDeconnecter()" hidden>Se déconnecter de Google</button>
            <label class="compte-file">Restaurer un fichier
                <input type="file" accept="application/json,.json" onchange="compteImporterFichier(this)" style="display:none;">
            </label>
            <button type="button" onclick="compteOuvrirOnglet()">Ouvrir dans un onglet (pour Google)</button>
            <button type="button" onclick="memoireEffacer()" style="color:#b91c1c;border-color:#fecaca;">Effacer ma progression</button>
        </div>

        <details class="compte-setup" id="compteSetup">
            <summary>Si le bouton Google ne s’ouvre pas</summary>
            <ol>
                <li>Dans Google Cloud, ouvre l’ID client de type « Application Web ».</li>
                <li>Ajoute cette origine JavaScript autorisée, sans chemin après le domaine :</li>
            </ol>
            <p id="compteOrigine" class="compte-origine"></p>
            <input id="compteClientIdInput" type="text" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off">
            <button type="button" class="primary" onclick="compteEnregistrerClientId()">Enregistrer et connecter</button>
        </details>
        <p id="compteMessage" class="compte-msg" hidden></p>
    </div>
</div>
