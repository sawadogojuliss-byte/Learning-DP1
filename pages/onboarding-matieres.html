<!-- ============================================================
     PAGE : Matières
     Configuration HL / SL.
     Script : js/pages/onboarding-matieres.js
     ============================================================ -->
<!-- Subjects Modal (Page 4) -->
    <div class="context-modal" id="subjectsModal">
        <div class="context-shape context-shape-1 animate-float"></div>
        <div class="context-shape context-shape-2 animate-float-reverse" style="right: -2.5rem; left: auto;"></div>
        
        <div class="context-center" style="padding: 2rem 1rem;">
            <div class="context-card animate-fade-in-up" style="max-width: 64rem;">
                <div class="progress-indicator">
                    <div class="progress-step progress-step-active">✓</div>
                    <div class="progress-line progress-line-active" style="width: 2.5rem;"></div>
                    <div class="progress-step progress-step-active">✓</div>
                    <div class="progress-line progress-line-active" style="width: 2.5rem;"></div>
                    <div class="progress-step progress-step-active">✓</div>
                    <div class="progress-line progress-line-active" style="width: 2rem;"></div>
                    <div class="progress-step progress-step-active">✓</div>
                    <div class="progress-line progress-line-active" style="width: 2rem;"></div>
                    <div class="progress-step progress-step-active">5</div>
                    <div class="progress-line progress-line-inactive" style="width: 2.5rem;"></div>
                    <div class="progress-step progress-step-inactive">...</div>
                </div>

                <div class="context-icon" style="width: 5rem; height: 5rem;">
                    <span style="font-size: 2.5rem;">📚</span>
                </div>

                <h1 class="context-title">Tes matières IB</h1>
                <p class="context-subtitle">Aucune matière n'est imposée. Choisis-en 6, avec 3 HL et 3 SL</p>

                <!-- HL/SL Counters -->
                <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem;">
                    <span id="hlCounter" class="counter-badge invalid-hl">HL: 0/3</span>
                    <span id="slCounter" class="counter-badge invalid-sl">SL: 0/3</span>
                </div>

                <!-- Une seule section : toutes les matières -->
                <div style="margin-bottom: 2rem; background: linear-gradient(to bottom right, #f9fafb, #f0fdfa); border: 1px solid #e5e7eb; border-radius: 1.25rem; padding: 1.25rem;">
                    <h3 style="font-size: 1.125rem; font-weight: 700; color: #1f2937; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between;">
                        <span style="display: flex; align-items: center;"><span style="width: 0.5rem; height: 0.5rem; background: #10b981; border-radius: 50%; margin-right: 0.5rem;"></span>Matières</span>
                        <span id="subjectsCount" style="font-size: 0.875rem; font-weight: 700; color: #047857; background: #d1fae5; border-radius: 999px; padding: 0.25rem 0.7rem;">0/6</span>
                    </h3>
                    <div id="subjectsList" style="display: flex; flex-direction: column; gap: 1rem;"></div>
                    <div id="addSubjectWrap" style="margin-top: 1rem;">
                        <select id="addSubjectSelect" onchange="handleAddSubject(this)" style="width: 100%; padding: 1rem; border: 2px dashed #d1d5db; border-radius: 1rem; background: white; color: #6b7280; cursor: pointer; font-size: 1rem;"></select>
                    </div>
                </div>

                <!-- Validation Message -->
                <div id="validationMsg" class="validation-box invalid">⚠️ Configuration incomplète. Il te faut exactement 6 matières (3 HL et 3 SL)</div>

                <div class="context-buttons">
                    <button id="subjectsContinueBtn" class="btn-continue" onclick="validateSubjects()" disabled>Continuer →</button>
                    <button class="btn-back" onclick="hideSubjectsPage()">← Retour</button>
                </div>
            </div>
        </div>
    </div>
