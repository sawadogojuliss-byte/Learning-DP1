<!-- ============================================================
     PAGE : Temps libre
     Après le temps d'écran, avant les jours fériés.
     Maximum 3 h par jour, choisi par l'élève.
     Script : js/pages/onboarding-libre.js
     ============================================================ -->
<div class="context-modal" id="freeTimeModal">
    <div class="context-shape context-shape-1 animate-float"></div>
    <div class="context-shape context-shape-2 animate-float-reverse" style="right: -2.5rem; left: auto;"></div>

    <div class="context-center" style="padding: 2rem 1rem;">
        <div class="context-card animate-fade-in-up" style="max-width: 42rem;">
            <div class="progress-indicator">
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">✓</div>
                <div class="progress-line progress-line-active" style="width: 1rem;"></div>
                <div class="progress-step progress-step-active">9</div>
            </div>

            <div class="context-icon" style="width: 5rem; height: 5rem;">
                <span style="font-size: 2.5rem;">🎮</span>
            </div>

            <h1 class="context-title">Temps libre</h1>
            <p class="context-subtitle">Choisis, pour chaque jour, combien de temps tu gardes pour toi. Maximum 3 h par jour.</p>

            <div style="margin: 1rem 0;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input id="sameFreeTimeInput" type="checkbox" checked onchange="setSameFreeTime(this.checked)" style="width: 1.25rem; height: 1.25rem;">
                    <span style="font-size: 0.875rem; color: #4b5563;">Même durée pour tous les jours</span>
                </label>
            </div>

            <div id="freeTimeChoices" style="margin-bottom: 0.75rem;"></div>
            <p id="freeTimeError" style="display: none; color: #ef4444; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem;"></p>

            <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 1rem; padding: 0.9rem; margin-bottom: 1.25rem;">
                <p style="color: #166534; font-size: 0.85rem; line-height: 1.5;">3 h est le maximum. Si tu essaies d'en prendre plus, la durée reste à 3 h.</p>
            </div>

            <div class="context-buttons">
                <button class="btn-continue" onclick="generatePlanning()">Continuer →</button>
                <button class="btn-back" onclick="goBackFromFreeTime()">← Retour</button>
            </div>
        </div>
    </div>
</div>
