<!-- ============================================================
     PAGE : Pomodoro — ouverte à tous
     Le minuteur seul : la liste des séances est sur la page
     « Séance de révision du jour ».
     Script : js/pages/pomodoro-page.js
     ============================================================ -->
<div class="app-panel" id="panelPomodoro">
    <div class="focus-page" id="focusPage" hidden>
        <!-- L'image affichée ne change qu'une fois la suivante décodée : pas de
             fondu, donc jamais l'ancienne image qui revient ni le planning. -->
        <div class="focus-bg" id="focusBg"></div>
        <div class="focus-shade"></div>
        <header class="focus-top">
            <p class="focus-logo">Study Plan IB</p>
            <p class="focus-nom">Pomodoro</p>
        </header>
        <main class="focus-center">
            <label class="focus-sr" for="focusTache">Sur quoi veux-tu te concentrer ?</label>
            <input id="focusTache" class="focus-question" maxlength="120" placeholder="Sur quoi veux-tu te concentrer ?" autocomplete="off">
            <div class="focus-modes" role="tablist">
                <button type="button" id="focusModeFocus" class="is-on" role="tab" onclick="focusChoisirMode('focus')">CONCENTRATION</button>
                <button type="button" id="focusModeShort" role="tab" onclick="focusChoisirMode('short')">PAUSE COURTE</button>
                <button type="button" id="focusModeLong" role="tab" onclick="focusChoisirMode('long')">PAUSE LONGUE</button>
            </div>
            <p class="focus-time" id="focusTime">25:00</p>
            <div class="focus-controls">
                <button type="button" id="focusPlay" class="focus-glass" onclick="focusBasculer()" aria-label="Démarrer">
                    <svg id="focusIconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
                    <svg id="focusIconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/></svg>
                </button>
                <button type="button" class="focus-glass" onclick="focusRecommencer()" aria-label="Recommencer">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4.5V9h-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" id="focusBtnPip" class="focus-glass" onclick="focusImageDansImage()" aria-label="Image dans l'image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><rect x="11.5" y="11" width="7.5" height="5.2" rx="1" fill="currentColor"/></svg>
                </button>
            </div>
            <p id="focusAstuce" class="focus-tip" hidden></p>
        </main>
        <div id="focusPipLocal" class="focus-pip" hidden>
            <button type="button" class="focus-pip-fermer" onclick="focusFermerPip()" aria-label="Fermer">×</button>
            <div class="focus-pip-scene" id="focusPipScene">
                <p class="focus-pip-temps" id="focusPipTemps">25:00</p>
                <button type="button" id="focusPipPlay" class="focus-pip-play" onclick="focusBasculer()" aria-label="Démarrer">
                    <svg class="pip-ico-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
                    <svg class="pip-ico-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/></svg>
                </button>
                <span class="focus-pip-coin">
                    <svg class="focus-pip-eclair" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f59e0b" d="M13 2 3.5 13.5h7.2L9.2 22 20.5 9.8h-7.2L13 2z"/></svg>
                    <span class="focus-pip-points" aria-hidden="true"><i></i><i></i><i></i></span>
                </span>
            </div>
        </div>
        <div id="focusFonds" class="focus-fonds" hidden></div>
        <aside id="focusTaches" class="focus-panneau focus-taches" hidden>
            <div class="focus-taches-haut">
                <span class="focus-taches-icone" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 7h11M8 12h11M8 17h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 7h.01M4 12h.01M4 17h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                </span>
                <p class="focus-panneau-titre">Tâches</p>
            </div>
            <ul id="focusListe"></ul>
            <form class="focus-ajout" onsubmit="return focusAjouterTache(event)">
                <input id="focusNouvelle" maxlength="120" placeholder="Ta priorité" autocomplete="off">
            </form>
            <button type="button" class="focus-ajout-centre" onclick="focusAjouterDepuisBouton()">+ Ajouter une tâche</button>
        </aside>
        <aside id="focusReglages" class="focus-panneau focus-reglages" hidden>
            <p class="focus-panneau-titre">Durées</p>
            <label>Concentration <input id="focusDureeFocus" type="number" min="1" max="180" value="25" onchange="focusSauverDurees()"></label>
            <label>Pause courte <input id="focusDureeShort" type="number" min="1" max="60" value="5" onchange="focusSauverDurees()"></label>
            <label>Pause longue <input id="focusDureeLong" type="number" min="1" max="60" value="15" onchange="focusSauverDurees()"></label>
            <p class="focus-note">La pause longue arrive toutes les 4 concentrations.</p>
        </aside>
        <div id="focusSons" class="focus-sons" hidden onclick="focusFermerSonsSiFond(event)">
            <div class="focus-sons-carte" role="dialog" aria-label="Sons">
                <div class="focus-sons-haut">
                    <p class="focus-sons-titre">Sons</p>
                    <div class="focus-sons-actions">
                        <button type="button" class="focus-sons-mini" onclick="focusPauseSon()" aria-label="Pause du son">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/></svg>
                        </button>
                        <button type="button" class="focus-sons-mini" onclick="focusReinitSon()" aria-label="Réinitialiser le son">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4.5V9h-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <select id="focusFiltreSon" onchange="focusFiltrerSons()" aria-label="Filtrer les sons">
                            <option value="tous">Tous</option>
                            <option value="nature">Nature</option>
                            <option value="ville">Ville</option>
                            <option value="bruits">Bruits</option>
                            <option value="concentration">Concentration</option>
                        </select>
                    </div>
                </div>
                <div id="focusSonsGrille" class="focus-sons-grille"></div>
            </div>
        </div>
        <footer class="focus-bottom">
            <div class="focus-outils">
                <button type="button" id="focusBtnTaches" class="focus-rond" onclick="focusBasculerTaches()" aria-label="Tâches">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 7h11M8 12h11M8 17h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 7h.01M4 12h.01M4 17h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                </button>
                <button type="button" id="focusBtnSon" class="focus-rond" onclick="focusBasculerSons()" aria-label="Sons">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.2" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="16" r="2.2" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
            <div class="focus-outils">
                <span class="focus-flamme" title="Jours d'affilée">🔥 <span id="focusFlamme">0</span></span>
                <button type="button" id="focusBtnFonds" class="focus-rond" onclick="focusBasculerFonds()" aria-label="Changer l'image">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .4-8 6 6 0 0 0-11.5-1.6A3.5 3.5 0 0 0 7 18z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" class="focus-rond" onclick="focusMaison()" aria-label="Retour à l'emploi du temps">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" id="focusBtnAstuce" class="focus-rond focus-ampoule" onclick="focusBasculerAstuce()" aria-label="Conseil">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 14a5 5 0 1 1 8 0c-.8.9-1.5 1.6-1.5 2.5h-5C9.5 15.6 8.8 14.9 8 14z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" id="focusBtnReglages" class="focus-rond" onclick="focusBasculerReglages()" aria-label="Durées">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <button type="button" class="focus-rond" onclick="focusPleinEcran()" aria-label="Agrandir">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 5h5v5M10 19H5v-5M19 14v5h-5M5 10V5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </footer>
    </div>
</div>
