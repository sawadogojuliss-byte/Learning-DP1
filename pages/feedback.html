<!-- ============================================================
     PAGE : Feedback
     Suggestions pour améliorer le site.
     Script : js/pages/boite.js
     ============================================================ -->
<div class="app-panel" id="panelFeedback">
    <header class="study-topbar">
        <div class="study-topbar-inner">
            <button type="button" class="study-back" onclick="memoireRetour()" aria-label="Revenir à la page précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
            <div class="study-topbar-brand"><span class="study-topbar-logo"><img src="images/logo.png" alt="Logo Studyplan" width="42" height="42"></span><span><strong>Studyplan</strong><small>MON ESPACE D’ÉTUDE</small></span></div>
            <span class="study-topbar-note">Un pas à la fois <span aria-hidden="true">✦</span></span>
        </div>
    </header>
    <div style="max-width:480px;margin:0 auto;padding:0 1rem 4rem;">
        <div class="study-page-title"><h2>Feedback</h2><p>Une suggestion pour le site</p></div>

        <div style="background:linear-gradient(135deg,#059669,#10b981);border-radius:1.25rem;padding:1.25rem 1.35rem;margin-bottom:1.25rem;color:white;">
            <p style="font-size:0.8rem;opacity:0.85;margin-bottom:0.2rem;" id="feedbackNom"></p>
            <p style="font-size:0.95rem;font-weight:650;line-height:1.45;">As-tu une suggestion pour améliorer le site ? Si oui, renseigne-la ci-dessous.</p>
        </div>

        <label for="feedbackEmail" style="display:block;font-size:0.8rem;font-weight:700;color:#374151;margin-bottom:0.4rem;">Ton e-mail</label>
        <input id="feedbackEmail" type="email" autocomplete="email" maxlength="120" placeholder="prenom@email.com" style="width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:0.9rem;padding:0.8rem 1rem;font:inherit;font-size:0.95rem;margin-bottom:0.85rem;">

        <label for="feedbackTexte" style="display:block;font-size:0.8rem;font-weight:700;color:#374151;margin-bottom:0.4rem;">Ta suggestion</label>
        <textarea id="feedbackTexte" maxlength="800" rows="6" placeholder="Écris ici…" style="width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:0.9rem;padding:0.85rem 1rem;font:inherit;font-size:0.95rem;resize:vertical;"></textarea>
        <button type="button" id="feedbackEnvoi" style="width:100%;margin-top:0.85rem;padding:0.9rem 1rem;border:none;border-radius:0.9rem;background:linear-gradient(135deg,#059669,#10b981);color:white;font-weight:800;font-size:0.95rem;cursor:pointer;">Envoyer</button>
        <p id="feedbackStatut" style="min-height:1.25rem;margin-top:0.75rem;font-size:0.85rem;font-weight:650;color:#047857;"></p>
    </div>
</div>
